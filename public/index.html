<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BROKEN LORD DR - Pair Code & QR</title>
  <style>
    body {
      background: #050816;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 10px;
    }
    .card {
      background: #0b1020;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.15);
      border: 1px solid rgba(0, 255, 255, 0.25);
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #00e5ff;
    }
    p {
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #050816;
      color: #f5f5f5;
      outline: none;
    }
    button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #00e5ff, #7c4dff);
      color: #050816;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      font-size: 14px;
      word-break: break-all;
    }
    img {
      margin-top: 10px;
      border-radius: 8px;
      background: #fff;
      padding: 5px;
    }
    .note {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>BROKEN LORD DR</h1>
    <p>Ingiza namba yako ya WhatsApp (mfano: 2557XXXXXXXX), kisha bonyeza Generate kupata <b>PAIR CODE</b> na <b>QR CODE</b>.</p>

    <input id="number" placeholder="2557XXXXXXXX" />
    <button id="btn" onclick="generate()">Generate</button>

    <div class="result">
      <div><b>PAIR CODE:</b></div>
      <pre id="pair"></pre>

      <div><b>QR CODE:</b></div>
      <img id="qr" alt="QR Code" />
    </div>

    <div class="note">
      Chagua kutumia Pair Code au QR kwenye Linked Devices.  
      Bot: <b>BROKEN LORD DR</b>
    </div>
  </div>

  <script>
    async function generate() {
      const btn = document.getElementById("btn");
      const number = document.getElementById("number").value.trim();
      const pairEl = document.getElementById("pair");
      const qrEl = document.getElementById("qr");

      if (!number) {
        alert("Tafadhali weka namba kwanza.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Generating...";

      pairEl.innerText = "";
      qrEl.src = "";

      try {
        const res = await fetch("/generate?number=" + encodeURIComponent(number));
        const data = await res.json();

        if (!data.success) {
          alert(data.error || "Imeshindikana kupata pair code.");
        } else {
          pairEl.innerText = data.pairCode || "Haikupatikana (jaribu tena)";
          if (data.qrImage) {
            qrEl.src = data.qrImage;
          } else {
            qrEl.alt = "QR haikupatikana";
          }
        }
      } catch (e) {
        console.error(e);
        alert("Kuna hitilafu, jaribu tena.");
      }

      btn.disabled = false;
      btn.innerText = "Generate";
    }
  </script>
</body>
</html>
