<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BROKEN LORD DR - Pair Code & QR</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial; height: 100vh; overflow: hidden; color: #fff; }

  #bg-video {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; z-index: -3;
    filter: brightness(0.35);
  }

  .overlay {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(5, 8, 22, 0.6);
    z-index: -2;
  }

  .particle {
    position: absolute; width: 6px; height: 6px;
    background: #00e5ff; border-radius: 50%;
    animation: floatUp 8s linear infinite; opacity: 0.7;
  }

  @keyframes floatUp {
    from { transform: translateY(100vh); opacity: 0; }
    to { transform: translateY(-10vh); opacity: 1; }
  }

  .card {
    width: 420px; background: rgba(0,0,0,0.55);
    backdrop-filter: blur(12px);
    border-radius: 15px; padding: 25px;
    margin: auto; margin-top: 60px;
    box-shadow: 0 0 25px rgba(0,255,255,0.25);
    border: 1px solid rgba(0,255,255,0.3);
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
  }

  h1 { text-align: center; font-size: 28px; margin-bottom: 10px; color: #00e5ff; text-shadow: 0 0 15px #00e5ff; }
  p { text-align: center; opacity: 0.85; font-size: 14px; }

  input {
    width: 100%; padding: 12px; margin-top: 18px;
    border-radius: 8px; border: none;
    background: rgba(255,255,255,0.1);
    color: #fff; outline: none; font-size: 15px;
  }

  button {
    width: 100%; padding: 12px; margin-top: 15px;
    border-radius: 8px; border: none;
    background: linear-gradient(90deg, #00e5ff, #7c4dff);
    color: #050816; font-weight: bold; cursor: pointer;
    font-size: 16px; box-shadow: 0 0 15px rgba(0,255,255,0.4);
  }

  .result { margin-top: 20px; font-size: 14px; word-break: break-all; }
  img { margin-top: 10px; border-radius: 10px; background: #fff; padding: 5px; width: 250px; }
  .note { margin-top: 15px; text-align: center; opacity: 0.7; font-size: 12px; }
</style>
</head>

<body>

<video autoplay muted loop id="bg-video">
  <source src="https://cdn.pixabay.com/vimeo/458749676/galaxy-46960.mp4?width=1280" type="video/mp4">
</video>

<div class="overlay"></div>

<script>
  for (let i = 0; i < 40; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDelay = Math.random() * 8 + "s";
    p.style.animationDuration = 6 + Math.random() * 6 + "s";
    document.body.appendChild(p);
  }
</script>

<div class="card">
  <h1>BROKEN LORD DR</h1>
  <p>Ingiza namba yako ya WhatsApp (mfano: 2557XXXXXXXX), kisha bonyeza Generate kupata <b>PAIR CODE</b> na <b>QR CODE</b>.</p>

  <input id="number" placeholder="2557XXXXXXXX" />
  <button id="btn" onclick="generate()">Generate</button>

  <div class="result">
    <div><b>PAIR CODE:</b></div>
    <pre id="pair"></pre>

    <div><b>QR CODE:</b></div>
    <img id="qr" alt="QR Code" />
  </div>

  <div class="note">
    Chagua kutumia Pair Code au QR kwenye Linked Devices.<br>
    Bot: <b>BROKEN LORD DR</b>
  </div>
</div>

<script>
async function generate() {
  const btn = document.getElementById("btn");
  const number = document.getElementById("number").value.trim();
  const pairEl = document.getElementById("pair");
  const qrEl = document.getElementById("qr");

  if (!number) return alert("Tafadhali weka namba kwanza.");

  btn.disabled = true;
  btn.innerText = "Generating...";
  pairEl.innerText = "";
  qrEl.src = "";

  try {
    const res = await fetch("/generate?number=" + encodeURIComponent(number));
    const data = await res.json();

    pairEl.innerText = data.pairCode || "Haikupatikana (jaribu tena)";
    qrEl.src = data.qrImage || "";
  } catch {
    alert("Hitilafu imetokea.");
  }

  btn.disabled = false;
  btn.innerText = "Generate";
}
</script>

</body>
</html>
